name: Deploy Football/Soccer Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare layout-only site
        run: |
          mkdir -p _site/data
          cp index.html competition.html platform.html stats.html entity.html match.html health.html advanced.html research.html weekly.html accuracy.html news.html commentary.html playbook.html rulebook.html favorites.html calendar.html _site/
          cp layout.css site.js favicon.svg _site/
          cp data/competitions.json _site/data/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
