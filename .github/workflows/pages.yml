name: Deploy Football Stats Tracker

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      sync_group:
        description: Data section to refresh (leave blank to rotate automatically)
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '90' }}
      SYNC_GROUP: ${{ inputs.sync_group || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh football data snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_data.py
      - name: Commit data snapshots
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.API_FOOTBALL_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json data/provider-map.json data/competitions/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football data snapshots"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
